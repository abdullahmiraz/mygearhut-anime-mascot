<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyGearHut Anime Mascot</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="anime-viewer">
    <div id="app">
      <div id="stage" aria-label="3D mascot viewport"></div>
      <header class="topbar" data-ui>
        <div class="brand"><span class="dot"></span><span>MyGearHut <b>Anime</b></span></div>
        <div class="topbar-actions">
          <a class="variant-link" href="./anime-v2.html">Anime v2</a>
          <a class="variant-link" href="./index.html">Original mascot</a>
          <button id="ui-toggle" class="ghost" type="button">Hide UI</button>
        </div>
      </header>
      <aside class="panel" data-ui>
        <section>
          <h2>State</h2>
          <div class="row" id="states">
            <button type="button" data-state="idle" class="active">Idle</button>
            <button type="button" data-state="thinking">Think</button>
            <button type="button" data-state="speaking">Speak</button>
            <button type="button" data-state="waving">Wave</button>
            <button type="button" data-state="error">Error</button>
            <button type="button" data-state="presenting">Present</button>
            <button type="button" data-state="point-left">Point left</button>
            <button type="button" data-state="point-right">Point right</button>
            <button type="button" data-state="comparing">Compare</button>
            <button type="button" data-state="nodding">Nod</button>
            <button type="button" data-state="celebrating">Celebrate</button>
          </div>
          <div class="row presenter-tools">
            <button id="talk-toggle" type="button" aria-pressed="false">Talk</button>
            <button id="pointer-toggle" type="button" aria-pressed="false">Pointer</button>
          </div>
        </section>
        <section>
          <h2>Framing</h2>
          <div class="row" id="framing">
            <button type="button" data-frame="full">Full</button>
            <button type="button" data-frame="medium" class="active">Medium</button>
            <button type="button" data-frame="close">Close</button>
          </div>
          <div class="row presenter-tools" aria-label="Camera moves">
            <button type="button" data-zoom="in">Push in</button>
            <button type="button" data-zoom="out">Pull out</button>
            <button type="button" data-zoom="punch">Punch in</button>
          </div>
        </section>
        <section>
          <h2>Background</h2>
          <div class="row" id="background">
            <button type="button" data-bg="dark" class="active">Dark</button>
            <button type="button" data-bg="light">Light</button>
            <button type="button" data-bg="transparent">Alpha</button>
          </div>
          <div class="row presenter-tools">
            <button id="overlay" type="button" aria-pressed="false">Fit transparent overlay</button>
            <button id="save-png" type="button">Save PNG</button>
          </div>
        </section>
        <p class="hint">1–5 poses · T talk · P pointer · H hide UI</p>
      </aside>
      <div class="status" data-ui id="status">Ready</div>
    </div>
    <script type="module" src="/src/anime-main.js"></script>
  </body>
</html>
